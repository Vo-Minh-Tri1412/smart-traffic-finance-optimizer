[project]
name = "ai-quantum-hvtc"
version = "0.0.0"
description = "SUMO-RL smart traffic signal optimization for public finance decision support."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy<2.5",
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
    "plotly>=6.8.0",
    "requests>=2.34.2",
    "stable-baselines3>=2.7.0",
    "streamlit>=1.58.0",
    "sumo-rl>=1.4.5",
]

[dependency-groups]
dev = [
  "mypy>=1.18.2",
  "pytest>=9.0.1",
  "ruff>=0.14.8",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
