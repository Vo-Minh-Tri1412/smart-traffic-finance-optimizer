summary = "Reserve each dashboard RunStore run directory exclusively before any serializer runs. Duplicate or partial run IDs fail without modifying prior contents; concurrent same-ID saves have one owner; failed partial writes are never resumed. This preserves the existing API/schema and run-ID behavior, and does not integrate dashboard data with TASK-098 experiment identity or verified-output manifests."
