id = "041_cloud_rl_reward_scaffold"
owner = "integrator"
branch = "main"
base_commit = "44eaf47fffef6e782ddebe0baa9ee53ce2234308"
allowed_paths = [
  "coordination/tasks/041_cloud_rl_reward_scaffold.toml",
  "ai_quantum_hvtc/rl/**",
  "scripts/training/**",
  "configs/training/rl_reward_profile_v0.example.toml",
  "tests/unit/rl/**",
  "tests/integration/cli/test_rl_sumo_train_cli.py",
]
dependencies = [
  "027_sumo_baseline_report_v1",
]
acceptance_commands = [
  "uv run python scripts/training/rl_sumo_train.py --spec tests/fixtures/specs/minh_khai_district_v1.json --scenario normal_weekday --reward-profile configs/training/rl_reward_profile_v0.example.toml --out-dir artifacts/tmp/rl_training_scaffold --dry-run",
  "uv run pytest tests/unit/rl tests/integration/cli/test_rl_sumo_train_cli.py -q",
  "uv run python -m ai_quantum_hvtc doctor",
  "uv run ruff format --check .",
  "uv run ruff check .",
  "uv run mypy ai_quantum_hvtc scripts",
  "uv run python scripts/admin/validate_agent_tasks.py --task coordination/tasks/041_cloud_rl_reward_scaffold.toml",
]
status = "done"

[handoff]
summary = "Added a cloud-oriented SUMO-RL training scaffold that is safe to keep untrained locally: reward profiles are loaded from TOML, validated against the district spec, exposed as a SUMO-RL callable reward, and checked by a dry-run CLI. The script blocks accidental local training, reports draft/pending hard-constraint blockers, and can train PPO on Colab/Kaggle once reward status and hard-constraint policy are intentionally resolved."
validation = [
  "uv run python scripts/training/rl_sumo_train.py --spec tests/fixtures/specs/minh_khai_district_v1.json --scenario normal_weekday --reward-profile configs/training/rl_reward_profile_v0.example.toml --out-dir artifacts/tmp/rl_training_scaffold --dry-run -> passed; validation_errors empty; expected blockers for draft reward and pending emergency preemption",
  "uv run pytest tests/unit/rl tests/integration/cli/test_rl_sumo_train_cli.py -q -> 6 passed",
  "uv run python -m ai_quantum_hvtc doctor -> passed",
  "uv run ruff format --check . -> passed",
  "uv run ruff check . -> passed",
  "uv run mypy ai_quantum_hvtc scripts -> passed",
  "uv run python scripts/admin/validate_agent_tasks.py --task coordination/tasks/041_cloud_rl_reward_scaffold.toml -> passed",
  "uv run python scripts/admin/validate_agent_tasks.py --task coordination/tasks/041_cloud_rl_reward_scaffold.toml --changed-file <8 task files> -> passed",
]
risks = [
  "The scaffold trains signal control only; it does not add RL route-choice/rerouting actions.",
  "Emergency vehicle preemption is represented as a hard-constraint contract and intentionally blocks final training unless implemented or explicitly acknowledged.",
  "The example reward profile is still status = draft and must be reviewed by Economics/CS before real training claims.",
  "Existing unrelated dirty files under render/addons/godot_ai/** were preserved and are outside this task.",
]
next_steps = [
  "Have Economics/CS edit configs/training/rl_reward_profile_v0.example.toml or copy it to an approved profile with sourced/accepted weights.",
  "Implement the emergency action-filter/override layer before final policy claims involving ambulance priority.",
  "Run the training script on Colab/Kaggle with Drive/Kaggle output storage after the profile is approved.",
]
