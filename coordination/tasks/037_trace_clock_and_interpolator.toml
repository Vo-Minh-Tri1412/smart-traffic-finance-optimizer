[handoff]
summary = "Added TracePlaybackClock and TraceInterpolator so Godot replay time, speed/loop control, and between-frame vehicle positions are separate from TraceReplayController. The controller now samples interpolated frames and reports playback/interpolation metadata in replay_summary.json."
validation = "Godot replay smoke passed with playback_data_model=TracePlaybackClock/TraceInterpolator and interpolated_frame_count=9; targeted replay pytest passed; ruff format/check passed; mypy passed; full pytest passed with 43 tests."
risks = "Interpolation currently linearly blends SUMO x/y/speed and shortest-path angle between neighboring trace frames. Lane/road ids snap by alpha threshold rather than path-aware lane matching; this is fine for v1 replay but not yet a traffic-physics claim."
next_steps = "Implement VehiclePool next so replay/dataset generation can reuse vehicle instances instead of instantiate/queue_free per vehicle lifecycle."
