[handoff]
summary = "Added VehiclePool between TraceReplayController and VehicleFactory. The controller now acquires vehicle nodes from the pool and releases stale nodes back into hidden reusable buckets instead of queue_free. Replay summaries expose pool model and created/reused/released/available counts."
validation = "Godot replay smoke passed; targeted replay pytest passed with a regression trace proving release/reuse; ruff format/check passed; mypy passed; full pytest passed with 44 tests."
risks = "The standard SUMO smoke trace does not exercise release/reuse because its short sample keeps active vehicles alive; a dedicated test covers reuse. Pooling is per canonical vehicle type and does not yet enforce max pool sizes."
next_steps = "Next architecture task should focus on map/SUMO review or district map quality rather than adding more render lifecycle plumbing."
