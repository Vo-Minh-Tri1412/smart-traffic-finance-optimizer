validation = [
  "uv run python scripts/render/godot_synthetic_cv_smoke.py --help",
  "uv run python scripts/render/godot_synthetic_cv_smoke.py --dataset-id SYNTH-CV-GODOT-SMOKE --output-root data/processed/cv_yolo --force",
