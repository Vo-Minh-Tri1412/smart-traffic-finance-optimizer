  "uv run python scripts/admin/validate_agent_tasks.py --task coordination/tasks/020_godot_synthetic_cv_smoke.toml --changed-file <7 changed files>",
]
risks = [
  "The smoke exporter uses simple Godot-generated 2D imagery, not the final 3D district renderer.",
