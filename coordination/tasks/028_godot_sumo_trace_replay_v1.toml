[handoff]
summary = "Implemented Godot SUMO vehicle-level trace replay v1: trace JSONL contract now supports vehicles, Godot has a 3D-lite Main scene with placeholder roads/intersections/vehicles, and a Python wrapper can generate or consume SUMO traces and run headless replay smoke validation."
validation = [
  "uv run python -m ai_quantum_hvtc simulate run --engine sumo --spec tests/fixtures/specs/toy_public_district_v1.json --scenario normal_weekday --controller fixed_time --out <tmp>/result.json --trace-out <tmp>/trace.jsonl",
  "uv run python scripts/render/godot_sumo_trace_replay_smoke.py --trace <tmp>/trace.jsonl --spec tests/fixtures/specs/toy_public_district_v1.json --output-root <tmp>/godot_replay --max-frames 60",
  "uv run ruff format --check .",
  "uv run ruff check .",
  "uv run mypy ai_quantum_hvtc scripts",
  "uv run pytest",
  "uv run python scripts/admin/validate_agent_tasks.py --task coordination/tasks/028_godot_sumo_trace_replay_v1.toml",
]
risks = [
  "Replay visuals are intentionally placeholder 3D-lite assets; this is not final demo art.",
