summary = "Added explicit trace schema versioning across Python exporters, frontend contracts/mock traces, and Godot loaders. SUMO/FCD and aggregate trace frames now carry schema_version=simulation_trace_frame.v1. Godot centralizes supported versions in schema_versions.gd and fails clearly for unsupported trace or vehicle asset manifest versions."
