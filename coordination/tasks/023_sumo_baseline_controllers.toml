  "uv run ruff format --check .",
  "uv run ruff check .",
  "uv run mypy ai_quantum_hvtc scripts",
  "uv run pytest",
  "uv run python scripts/admin/validate_agent_tasks.py --task coordination/tasks/023_sumo_baseline_controllers.toml --changed-file <5 changed files>",
]
risks = [
